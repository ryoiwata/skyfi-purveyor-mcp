[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "purveyor"
version = "0.1.0"
description = "Remote MCP server wrapping SkyFi's Platform API for satellite imagery"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "mcp[cli]>=1.0.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13.0",
    "aiosqlite>=0.19.0",
    "geoalchemy2>=0.14.0",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
    "geopy>=2.4.0",
    "tenacity>=8.2.0",
    "structlog>=24.0.0",
    "cachetools>=5.3.0",
    "sentry-sdk[fastapi]>=2.0.0",
    "cryptography>=42.0.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "click>=8.1.0",
    "redis[hiredis]>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "testcontainers[postgres]>=4.0.0",
    "hypothesis>=6.100.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
    "types-cachetools>=5.3.0",
    "httpx>=0.27.0",
]

[project.scripts]
purveyor = "purveyor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/purveyor"]

[tool.mypy]
strict = true
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
no_implicit_reexport = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "geoalchemy2.*",
    "geopy.*",
    "shapely.*",
    "pyproj.*",
    "alembic.*",
    "testcontainers.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "ANN", "S", "B", "A", "C4", "PT", "RUF"]
ignore = [
    "S101",    # Use of assert (ok in tests)
    "S104",    # Binding to all interfaces (intentional for --host default)
    "ANN401",  # Dynamically typed expressions (Any) — needed for duck-typed cache/auth interfaces and __aexit__
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "S"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: marks tests as requiring real SkyFi API (deselect with '-m not live')",
]

[tool.coverage.run]
# Python 3.12 sys.monitoring-based tracer — required for accurate async coverage
# (classic tracer misses lines inside async context managers)
core = "sysmon"

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[dependency-groups]
dev = [
    "pytest-cov>=7.0.0",
]
