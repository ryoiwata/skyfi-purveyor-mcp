name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync
      - name: Ruff check
        run: uv run ruff check src/ tests/
      - name: Ruff format check
        run: uv run ruff format --check src/ tests/

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync
      - name: mypy
        run: uv run mypy src/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync
      - name: Run tests with coverage
        run: uv run pytest -m "not live" --cov=src/purveyor --cov-report=xml --cov-fail-under=80 -q
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.11'
        with:
          name: coverage-report
          path: coverage.xml

  build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -f deploy/docker/Dockerfile -t purveyor:test .
      - name: Start container
        run: |
          docker run -d \
            --name purveyor-test \
            -p 8000:8000 \
            -e LOCAL_MODE=true \
            -e SKYFI_API_KEY=test-key \
            purveyor:test
      - name: Wait for health
        run: |
          for i in $(seq 1 10); do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health || true)
            if [ "$status" = "200" ] || [ "$status" = "503" ]; then
              echo "Server responded with HTTP $status"
              exit 0
            fi
            echo "Attempt $i: server not ready (status=$status), waiting..."
            sleep 3
          done
          echo "Server failed to start"
          docker logs purveyor-test
          exit 1
      - name: Verify health endpoint
        run: |
          response=$(curl -s http://localhost:8000/health)
          echo "Health response: $response"
          echo "$response" | python3 -c "import sys, json; d=json.load(sys.stdin); assert 'status' in d, 'Missing status field'"
      - name: Cleanup
        if: always()
        run: docker rm -f purveyor-test || true

  docs:
    name: Docs Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check markdown files
        run: |
          find docs/ -name "*.md" -type f | while read f; do
            if [ ! -s "$f" ]; then
              echo "Empty markdown file: $f"
              exit 1
            fi
            echo "OK: $f"
          done
          echo "All documentation files are valid"
